<!DOCTYPE html>
<html lang="fr" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/htmx.min.js"></script>
    <script src="/assets/tailwind.js"></script>
    <script src="/assets/charts.js"></script>
    <script src="/assets/charts.component.js"></script>
    <script src="/assets/idiomorph.min.js" integrity="sha384-JcorokHTL/m+D6ZHe2+yFVQopVwZ+91GxAPDyEZ6/A/OEPGEx1+MeNSe2OGvoRS9" crossorigin="anonymous"></script>
    <script src="/assets/idiomorph-ext.min.js" integrity="sha384-szktAZju9fwY15dZ6D2FKFN4eZoltuXiHStNDJWK9+FARrxJtquql828JzikODob" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/assets/style.css">
    <title>Conference module library</title>
</head>

<body class="h-full flex flex-col" hx-ext="morph">
    <div class="border-b border-solid border-slate-200">
        <nav class="h-[80px] flex flex-row items-center p-4 justify-between w-full w-site mx-auto" hx-boost="true">
    <div>
        <a href="/">
            <img alt="logo des shifters" class="h-[50px]" src="/assets/logo.svg">
        </a>
    </div>
    <div class="flex flex-row items-center gap-1">
        <a href="/library"
           class="rounded-sm px-3.5 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50 hover:text-teal-700">
            Bibliothèque
        </a>
        <a href="/maker"
           class="rounded-sm px-3.5 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50 hover:text-teal-700">
            Créateur de conférences
        </a>
    </div>
</nav>
    </div>
    <div id="page-content" class="flex-1 min-h-0">
        {% block content %}{% endblock %}
    </div>
    <section id="toast-container" class="absolute bottom-0 right-0 p-3 flex flex-col gap-3 overflow-hidden"></section>
    <script>
        function removeToast(toast_id) {
            document.querySelector('#toast-' + toast_id)?.remove();
        }
    </script>
</body>

</html>

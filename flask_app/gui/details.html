{% extends "layout.html" %}
{% block content %}
<div class="mt-4 mx-4">
    <h1>{{ title }}</h1>
    <div class="flex flex-row">
        <img src="{{ image_url }}" class="w-96" />
        <div>
            <span>{{ description }}</span>
            <span>{{ duration_minutes }} minutes</span>
        </div>
    </div>
</div>
{% endblock %}
